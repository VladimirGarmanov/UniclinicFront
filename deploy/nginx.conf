# Include inside nginx's http {}. Install generated nginx-maps.conf alongside this file.
server_tokens off;
map_hash_bucket_size 512;
map_hash_max_size 16384;
include /srv/uniclinic/current/deploy/nginx-maps.conf;
limit_req_zone $binary_remote_addr zone=clinic_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=clinic_forms:10m rate=10r/m;
# No query strings, bodies, cookies, authorization headers or referrers in logs.
log_format clinic '$time_iso8601 $request_method $uri $status $request_time';
upstream clinic_api { server 127.0.0.1:8000; }
server {
    listen 80;
    server_name uniclinic.pro www.uniclinic.pro;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://uniclinic.pro$clinic_canonical_path$is_args$args; }
}
server {
    listen 443 ssl http2;
    server_name www.uniclinic.pro;
    ssl_certificate /etc/letsencrypt/live/uniclinic.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniclinic.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /srv/uniclinic/current/deploy/security-headers.conf;
    return 301 https://uniclinic.pro$clinic_canonical_path$is_args$args;
}
server {
    listen 443 ssl http2;
    server_name uniclinic.pro;
    root /srv/uniclinic/current/frontend;
    ssl_certificate /etc/letsencrypt/live/uniclinic.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniclinic.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    client_max_body_size 128k;
    access_log /var/log/nginx/uniclinic-access.log clinic;
    error_log /var/log/nginx/uniclinic-error.log warn;
    include /srv/uniclinic/current/deploy/security-headers.conf;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/xml image/svg+xml;
    # If ngx_brotli is installed, enable: brotli_static on;
    error_page 404 /404.html;
    error_page 405 = @method_not_allowed;
    if ($uri != $clinic_canonical_path) { return 301 https://uniclinic.pro$clinic_canonical_path$is_args$args; }
    location @method_not_allowed {
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header Allow "GET, HEAD" always;
        return 405;
    }
    location = /404.html {
        internal;
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location ~ (?:/\.|\.(?:php\d*|phtml|phar|map|env|sqlite|db|bak|zip)(?:$|/)) { return 404; }
    location = /api/admin/login {
        limit_req zone=clinic_login burst=3 nodelay;
        limit_req_status 429;
        include /srv/uniclinic/current/deploy/api-proxy.conf;
    }
    location ~ ^/api/(questions|reviews)$ {
        limit_req zone=clinic_forms burst=5 nodelay;
        limit_req_status 429;
        include /srv/uniclinic/current/deploy/api-proxy.conf;
    }
    location /api/ { include /srv/uniclinic/current/deploy/api-proxy.conf; }
    location = /questions/admin {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $clinic_ssg_file =404;
    }
    location ~ ^/(assets|media)/ {
        root /srv/uniclinic/shared;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /upload/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location ~ ^/(sitemap\.xml|robots\.txt|favicon\.svg|social\.png)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /srv/uniclinic/current/deploy/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $clinic_ssg_file =404;
    }
}
