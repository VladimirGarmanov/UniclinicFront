# Managed by Uniclinic deployment.
server {
    listen 80;
    server_name uniclinic.pro www.uniclinic.pro;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 300 always;
        default_type text/plain;
        return 503 "Uniclinic deployment is being prepared.\n";
    }
}
